# Local infrastructure for Bloom Event Manager V2.
#
#   docker compose -f deploy/docker-compose.yml --profile infra up -d
#
# Secrets come from deploy/.env (gitignored). Nothing sensitive belongs here.

name: bloom-v2

services:
  neo4j:
    # PINNED, not `latest`, on purpose. `latest` moves across major versions on
    # any re-pull, and Neo4j upgrades the store format in place: moving this tag
    # DOWN breaks an existing database, moving it UP migrates it irreversibly.
    # 2026.06.0 matches what V1 runs, which matters because Phase 1 validates
    # against V1's existing data. Change deliberately, with a data backup.
    image: neo4j:2026.06.0
    profiles: ["infra"]
    container_name: bloom-v2-neo4j
    restart: unless-stopped
    ports:
      - "7474:7474"
      - "7687:7687"
    environment:
      NEO4J_AUTH: "${NEO4J_USER:-neo4j}/${NEO4J_PASSWORD:-password}"
    volumes:
      - neo4j-data:/data
      - neo4j-logs:/logs
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://localhost:7474 || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 30s

  mongodb:
    # 8.2, not 8.0: MongoDB 8.0 refuses to start on Linux kernel 6.19+
    # (SERVER-121912), and Docker Desktop's VM kernel is well past that.
    # `mongo:latest` is still affected — 8.2 is the first tag that starts here.
    image: mongo:8.2
    profiles: ["infra"]
    container_name: bloom-v2-mongo
    restart: unless-stopped
    ports:
      - "27017:27017"
    volumes:
      - mongo-data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s

  redis:
    image: redis:7-alpine
    profiles: ["infra"]
    container_name: bloom-v2-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    command:
      - redis-server
      # Bounded memory with LRU eviction is what makes it safe to cache
      # embeddings without a TTL: under pressure Redis discards the coldest
      # entries. Persistence is deliberate for a cache here, because a cold
      # embedding costs a paid Gemini call to regenerate.
      - "--maxmemory"
      - "512mb"
      - "--maxmemory-policy"
      - "allkeys-lru"
      - "--appendonly"
      - "yes"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 5s

  kafka:
    # KRaft mode: no ZooKeeper container needed.
    #
    # 4.x, not 3.9: Testcontainers 2.0.5's KafkaContainer starts the image with
    # 0.0.0.0 advertised listeners, and 3.9's StorageTool refuses them outright,
    # so integration tests could not run a 3.9 broker at all. Keeping the dev
    # broker on the same major as the test broker — and as the kafka-clients
    # 4.1.2 that Spring Kafka 4.0.7 pulls in — avoids testing against one
    # version and running against another.
    image: apache/kafka:4.1.0
    profiles: ["infra"]
    container_name: bloom-v2-kafka
    restart: unless-stopped
    ports:
      - "9092:9092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      # Empty host, not 0.0.0.0. In KRaft the controller listener's bind address
      # is also validated as an advertised address, and Kafka rejects the
      # nonroutable meta-address 0.0.0.0 there ("advertised.listeners cannot use
      # the nonroutable meta-address"). An empty host binds all interfaces and
      # advertises the hostname, which is what the image's own default does.
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://localhost:9092
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@localhost:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      # Headroom for ChunkBatchReady: 20 chunks x ~12 KB embeddings plus text.
      KAFKA_MESSAGE_MAX_BYTES: 5242880
      KAFKA_REPLICA_FETCH_MAX_BYTES: 5242880
    volumes:
      - kafka-data:/var/lib/kafka/data
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:9092 >/dev/null 2>&1 || exit 1"]
      interval: 15s
      timeout: 10s
      retries: 10
      start_period: 30s

  zipkin:
    image: openzipkin/zipkin:3
    profiles: ["infra"]
    container_name: bloom-v2-zipkin
    restart: unless-stopped
    ports:
      - "9411:9411"
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://localhost:9411/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 15s

volumes:
  neo4j-data:
  neo4j-logs:
  mongo-data:
  redis-data:
  kafka-data:
