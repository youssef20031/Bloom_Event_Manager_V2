# Tests never talk to a Config Server. Without this the suite is not hermetic:
# each module's own application.yml declares
# spring.config.import=optional:configserver:..., and setting
# "spring.config.import=" in a @SpringBootTest does NOT suppress it. So whenever
# a Config Server happened to be running on :8888, tests silently pulled
# config-repo and behaved differently from a clean machine -- which is how a
# @WebMvcTest slice started failing on jwtSecurityFilterChain, and how a Kafka
# test's auto-offset-reset flipped between runs.
spring.cloud.config.enabled=false
