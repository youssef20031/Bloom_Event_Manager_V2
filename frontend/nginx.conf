server {
    listen 80;
    root /usr/share/nginx/html;

    # Docker's embedded DNS. Without a resolver, nginx resolves api-gateway once
    # at startup and caches that address for the life of the worker, so every API
    # call 502s with "connect() failed (111: Connection refused)" after the
    # gateway container is recreated on a new IP -- a restart, a redeploy, any
    # `compose up -d` that replaces it. First boot always works, because
    # depends_on holds the frontend back until the gateway is healthy, which is
    # what kept this hidden.
    resolver 127.0.0.11 valid=10s ipv6=off;

    # SPA deep links
    location / {
        try_files $uri /index.html;
    }

    # Same-origin API: the browser never learns the gateway's address.
    location /api/ {
        # The variable is what forces re-resolution per request; a literal host
        # here would be resolved once at startup no matter what the resolver
        # says. $request_uri is then required, because a proxy_pass assembled
        # from variables no longer appends the matched location by itself.
        set $bloom_gateway api-gateway;
        proxy_pass http://$bloom_gateway:8080$request_uri;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $remote_addr;
    }

    location /.well-known/ {
        set $bloom_gateway_wk api-gateway;
        proxy_pass http://$bloom_gateway_wk:8080$request_uri;
    }
}
