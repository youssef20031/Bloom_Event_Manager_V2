# Applied to every service that imports this Config Server.
spring:
  kafka:
    # Two listeners since Phase 5: kafka:9092 inside Compose, localhost:29092
    # from the host. Host-run services get the host one by default.
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:29092}
    template:
      observation-enabled: true
    listener:
      observation-enabled: true
    producer:
      # ChunkBatchReady: up to 20 chunks x ~12 KB embeddings. Compress, and raise
      # the ceiling well above the 1 MB default. Keep in step with the broker's
      # KAFKA_MESSAGE_MAX_BYTES in deploy/docker-compose.yml.
      compression-type: lz4
      properties:
        max.request.size: 5242880
    consumer:
      auto-offset-reset: earliest
      properties:
        max.partition.fetch.bytes: 5242880
  # ── Security (Phase 5) ───────────────────────────────────────────────────
  security:
    oauth2:
      resourceserver:
        jwt:
          # The gateway publishes the RS256 public key; every service validates against it.
          jwk-set-uri: ${JWT_JWKS_URI:http://localhost:8080/.well-known/jwks.json}

eureka:
  client:
    service-url:
      defaultZone: ${EUREKA_URL:http://localhost:8761/eureka/}
  instance:
    prefer-ip-address: true

# POST /actuator/refresh rebinds every @ConfigurationProperties bean, and Spring
# Cloud 5 first resets each one from a fresh default instance. EurekaInstanceConfigBean's
# no-arg constructor leaves hostname and ipAddress null -- InetUtils detects them at
# startup, nothing binds them -- so a refresh blanked them, the rebuilt Eureka client
# registered "<SERVICE>/null", got a 400, and the service dropped out of discovery.
# Seen live on 2026-09-24: retrieval-service vanished from Eureka and the gateway
# answered /retrieve with 503. Setting this property replaces its default, so the
# default's Hikari entry is repeated.
spring.cloud.refresh.never-refreshable: com.zaxxer.hikari.HikariDataSource,org.springframework.cloud.netflix.eureka.EurekaInstanceConfigBean

bloom:
  security:
    # Stamped by the gateway on forwarded requests; lets Kafka-triggered
    # service-to-service calls (no user, no JWT) authenticate as SERVICE.
    # Committed as {cipher} ciphertext (Phase 6): the Config Server decrypts it
    # with ENCRYPT_KEY before serving it, so no client ever needs the token in
    # its own environment. Single-quoted -- unquoted, YAML reads {cipher}... as
    # a flow mapping. This ciphertext belongs to this deployment; a new
    # deployment generates its own ENCRYPT_KEY and re-encrypts its own value.
    internal-token: '{cipher}52f40d911eee5b5a4d54c2ee6148993e6dadddc7548dfaf5d658d35ef2274c5b36a5c00eae957f77e435336fccf213e0f6cfa030266ac95f6dcaaa768f6dfabb'

management:
  endpoints:
    web:
      # `refresh` lets a running service pick up an edited config-repo file:
      # POST /actuator/refresh re-reads the Config Server and rebinds every
      # @ConfigurationProperties bean (e.g. bloom.retrieval.topK). Exposed on
      # every service that imports this file, which is fine: bloom-security (and
      # the gateway's own chain) leave only /actuator/health/** open, so the POST
      # must be authenticated -- X-Internal-Token on the services, a JWT anywhere --
      # and an anonymous one is a 401.
      exposure:
        include: health,info,metrics,refresh
  endpoint:
    health:
      # `when-authorized`, not `always`: /actuator/health/** is permit-all so the
      # Compose healthchecks can curl it without credentials, and the gateway is
      # published to the host. With `always`, an anonymous caller got the whole
      # discoveryComposite indicator — every registered service with its container
      # IP and port — plus host disk paths. Anonymous callers now get
      # {"status":"UP"} and a 200, which is all the probes read; an authenticated
      # caller still gets the full detail.
      show-details: when-authorized
      probes:
        enabled: true
  # ── Tracing (Phase 5) ────────────────────────────────────────────────────
  tracing:
    sampling:
      probability: 1.0
    # Boot 4 renamed management.zipkin.tracing.endpoint to
    # management.tracing.export.zipkin.endpoint and deprecated the old name at
    # level=error, which means it is dropped silently rather than warned about.
    # Under the old key every service fell back to the built-in default,
    # localhost:9411 -- correct when the JVMs run on the host, and wrong in every
    # container, where it sent each service's spans to its own empty localhost.
    export:
      zipkin:
        endpoint: ${ZIPKIN_ENDPOINT:http://localhost:9411/api/v2/spans}
  info:
    env:
      enabled: true

# ── Circuit breakers (Phase 5) ─────────────────────────────────────────────
spring.cloud.openfeign.circuitbreaker.enabled: true

resilience4j:
  circuitbreaker:
    configs:
      default:
        slidingWindowSize: 10
        minimumNumberOfCalls: 5
        failureRateThreshold: 50
        waitDurationInOpenState: 30s
        permittedNumberOfCallsInHalfOpenState: 3
  timelimiter:
    configs:
      default:
        # Resilience4j's own default is 1 s. 20 s suits hops that never wait on Gemini
        # generation; ai-service (90 s on `gemini`) and its callers chat, proposal and
        # retrieval (100 s) raise it in their own files.
        timeoutDuration: 20s
