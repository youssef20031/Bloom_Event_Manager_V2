server:
  port: 8086

spring:
  # `spring.mongodb.*`, NOT `spring.data.mongodb.*`. Boot 4 deprecated the
  # latter in favour of the former, and `spring.mongodb.uri` carries a non-null
  # default of `mongodb://localhost/test` that silently shadows the deprecated
  # keys — no warning, no failure. Phase 3b verification found the OAuth token
  # written to `test` while this file said `tokendb`. Only `auto-index-creation`
  # still lives under `spring.data.mongodb` (it is a Spring Data concern).
  mongodb:
    uri: ${MONGO_URI:mongodb://localhost:27017}
    # Set MONGO_TOKEN_DB to V1's database name to reuse the token V1 stored.
    database: ${MONGO_TOKEN_DB:tokendb}
  data:
    mongodb:
      # Deliberately off. Auto-index creation runs during context refresh, so an
      # unreachable MongoDB aborts startup instead of degrading to
      # "unauthenticated" the way MongoTokenStore.load is written to. The index
      # is created by DriveTokenIndexInitializer, which tolerates failure.
      auto-index-creation: false

bloom:
  security:
    permit-all:
      # Google redirects the browser here with the authorization code, and a
      # browser navigation cannot carry a Bearer token. The gateway lets the
      # matching /api/v1/rag/sync/auth/callback through for the same reason.
      - /api/v1/storage/auth/callback
  storage:
    client-id: ${GOOGLE_CLIENT_ID:}
    # Committed as {cipher} ciphertext (Task 4), decrypted by the Config
    # Server with ENCRYPT_KEY before being served. Single-quoted -- unquoted,
    # YAML reads {cipher}... as a flow mapping. This ciphertext belongs to
    # this deployment; a new deployment generates its own ENCRYPT_KEY and
    # re-encrypts its own value.
    client-secret: '{cipher}6bea9e129de588e6d5f5a4b84ee25e4081e6ac79a297ce8fb130386040a2f6350fbab37f178e762b40eb5c5bb24cf624807901ec3769c0e9f0321550b767d527'
    credentials-path: ${GOOGLE_CREDENTIALS_PATH:./secrets/client_secret.json}
    # Registered in Google Cloud Console. The gateway's legacy shim owns this path.
    redirect-uri: ${GOOGLE_OAUTH_REDIRECT_URI:http://localhost:8080/api/rag/auth/google/callback}
    root-folder-id: ${GOOGLE_DRIVE_FOLDER_ID:}
    sync-interval-ms: ${DRIVE_SYNC_INTERVAL_MS:300000}
    # The first poll at boot waits this long, so Feign can resolve
    # knowledge-service through Eureka before the sync needs it. Zero polls
    # immediately, which is what an operator turning auto-sync on by hand gets.
    sync-initial-delay-ms: ${DRIVE_SYNC_INITIAL_DELAY_MS:60000}
    frontend-url: ${FRONTEND_URL:http://localhost:5173}

management:
  endpoint:
    health:
      group:
        readiness:
          # Storage owns the OAuth token collection; without Mongo it cannot
          # serve traffic. Kafka and Eureka stay out — a hiccup there must not
          # pull the service out of rotation.
          include: readinessState,mongo

# ── Circuit breakers: a 4xx is not a breaker failure (Phase 5 review, I2) ───
# Spring Cloud CircuitBreaker records the error *before* the fallback runs
# (Resilience4JCircuitBreaker.getAndApplyFallback catches outside the decorated
# supplier), so the fallback factory's 4xx passthrough alone would still let a run of
# legitimate 404s or 401s from a peer open the breaker and short-circuit healthy
# traffic. A well-formed client error means the peer answered, so it must count as
# neither success nor failure. FeignClientException is Feign's own parent class for
# every 4xx, including statuses with no dedicated subclass; 5xx (FeignServerException)
# and connect failures (RetryableException, status -1) still count.
#
# Deliberately here and not in application.yml: ai-service and knowledge-service bind
# these same properties but carry no Feign on the classpath, and a class name that
# cannot be resolved fails property binding at startup.
resilience4j:
  circuitbreaker:
    configs:
      default:
        ignoreExceptions:
          - feign.FeignException$FeignClientException
