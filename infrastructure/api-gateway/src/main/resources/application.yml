server:
  port: 8080

spring:
  application:
    name: api-gateway
  config:
    import: optional:configserver:${CONFIG_SERVER_URL:http://localhost:8888}
  cloud:
    gateway:
      server:
        webflux:
          discovery:
            locator:
              # Routes are declared explicitly below. Automatic discovery-based
              # routing would also expose every service under its own id.
              enabled: false
          routes:
            - id: knowledge-ping
              uri: lb://knowledge-service
              predicates:
                - Path=/api/v1/rag/ping
              filters:
                - RewritePath=/api/v1/rag/ping,/api/v1/ping
            # sync-auth must precede sync: the more specific path wins only
            # because the gateway matches routes in declaration order.
            - id: sync-auth
              uri: lb://storage-service
              predicates:
                - Path=/api/v1/rag/sync/auth,/api/v1/rag/sync/auth/**
              filters:
                - RewritePath=/api/v1/rag/sync/auth(?<rest>.*),/api/v1/storage/auth$\{rest}
            - id: sync
              uri: lb://storage-service
              predicates:
                - Path=/api/v1/rag/sync,/api/v1/rag/sync/**
              filters:
                - RewritePath=/api/v1/rag/sync(?<rest>.*),/api/v1/storage/sync$\{rest}
            - id: retrieve
              uri: lb://retrieval-service
              predicates:
                - Path=/api/v1/rag/retrieve
              filters:
                - RewritePath=/api/v1/rag/retrieve,/api/v1/retrieve
            - id: ingest
              uri: lb://ingestion-service
              predicates:
                - Path=/api/v1/rag/ingest,/api/v1/rag/ingest/**
              filters:
                # $\{rest} is escaped on purpose: a bare ${rest} is consumed as a
                # Spring property placeholder before the gateway ever sees it.
                - RewritePath=/api/v1/rag/ingest(?<rest>.*),/api/v1/ingest$\{rest}
            - id: chat
              uri: lb://chat-service
              predicates:
                - Path=/api/v1/rag/chat,/api/v1/rag/chat/**
              filters:
                - RewritePath=/api/v1/rag/chat(?<rest>.*),/api/v1/chat$\{rest}
            - id: proposals
              uri: lb://proposal-service
              predicates:
                - Path=/api/v1/rag/proposals/**
              filters:
                - RewritePath=/api/v1/rag/proposals(?<rest>.*),/api/v1/proposals$\{rest}
            - id: generate-proposal
              uri: lb://proposal-service
              predicates:
                - Path=/api/v1/rag/generate-proposal
              filters:
                - RewritePath=/api/v1/rag/generate-proposal,/api/v1/proposals/generate
            - id: event-intake
              uri: lb://proposal-service
              predicates:
                - Path=/api/v1/rag/event-intake
              filters:
                - RewritePath=/api/v1/rag/event-intake,/api/v1/event-intake

management:
  endpoints:
    web:
      exposure:
        include: health,info,gateway
  endpoint:
    health:
      probes:
        enabled: true
