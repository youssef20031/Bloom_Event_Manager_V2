server:
  port: 8888

encrypt:
  # The one secret that cannot live in config-repo. 32+ random bytes. Deliberately
  # no default: without the key the server would serve every {cipher} value as
  # invalid.<name>, and clients would fail later and more confusingly.
  key: ${ENCRYPT_KEY}

spring:
  application:
    name: config-server
  profiles:
    # Filesystem backend rather than a git remote: one less moving part to run.
    active: native
  cloud:
    config:
      server:
        native:
          # In Docker, CONFIG_REPO points at the image's /config-repo --
          # config-repo/ baked in at build time (deploy/Dockerfile.service,
          # target config-server) and kept live by Compose Watch. From the
          # IDE, CONFIG_REPO is unset and this falls back to ./config-repo,
          # relative to the repository root the process is started from.
          search-locations: ${CONFIG_REPO:file:./config-repo}

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true
  # ── Tracing ──────────────────────────────────────────────────────────────
  # This server does not import config-repo, so it cannot inherit the tracing
  # settings every other service gets from config-repo/application.yml; they are
  # repeated here. Without them it sampled at Boot's default 10% and posted to the
  # built-in localhost:9411, which inside its container is its own empty loopback.
  # Boot 4 key: the old management.zipkin.tracing.endpoint is deprecated at
  # level=error and dropped silently.
  tracing:
    sampling:
      probability: 1.0
    export:
      zipkin:
        endpoint: ${ZIPKIN_ENDPOINT:http://localhost:9411/api/v2/spans}
